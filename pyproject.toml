[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-radar"
version = "0.1.0"
description = "Portable, evidence-backed X timeline triage"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
collector = ["certifi>=2024.0", "selenium>=4.25"]
semantic = [
  "numpy>=2.0,<3",
  "onnxruntime>=1.20,<2",
  "transformers>=4.48,<5",
]

[project.scripts]
x-radar = "xradar.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
