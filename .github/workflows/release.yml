name: Publish immutable Pi release

on:
  push:
    tags:
      - "x-radar-app-v*"

permissions:
  contents: write

concurrency:
  group: x-radar-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Verify source and dashboard
        run: |
          python -m pip install -e '.[collector]'
          PYTHONPATH=src python -m unittest discover -s tests -v
          python tools/check_public_tree.py
          npm --prefix site ci
          npm --prefix site run lint
          npm --prefix site test

      - name: Build reproducible Pi artifact
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python tools/build_release.py \
            --repository "$SOURCE_REPOSITORY" \
            --commit "$SOURCE_COMMIT" \
            --output-dir dist
          (cd dist && sha256sum -c x-radar-app-*.sha256)

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release-metadata.json \
            dist/x-radar-app-*.tar.gz \
            dist/x-radar-app-*.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Immutable X Radar Pi artifact built from $GITHUB_SHA."
